name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *" # Runs daily at 18:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'profile-3d-contrib/**'
      - 'contrib-3d.svg'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate 3D Contribution Map (Past 5 Months)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python3 scripts/generate_contrib_3d.py

      - name: Commit & Push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add profile-3d-contrib/ contrib-3d.svg
          if git diff --staged --quiet; then
            echo "No changes in 3D contribution graph."
          else
            git commit -m "chore(contrib): update 3d contribution graph (past 5 months) [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
