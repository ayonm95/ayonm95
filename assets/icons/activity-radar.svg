<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes spinRadar {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      @keyframes beaconPing {
        0%, 100% {
          transform: scale(0.85);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.3);
          opacity: 1;
        }
      }

      .radar-sweep {
        transform-origin: 16px 16px;
        animation: spinRadar 3s linear infinite;
      }

      .beacon-node {
        transform-origin: center;
        animation: beaconPing 1.8s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .radar-sweep, .beacon-node {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Isometric Base Grid -->
  <polygon points="16,6 27,12 16,18 5,12" stroke="#334155" stroke-width="0.8" fill="#0f172a" fill-opacity="0.6" />
  <polygon points="16,13 27,19 16,25 5,19" stroke="#334155" stroke-width="0.8" fill="#0f172a" fill-opacity="0.4" />
  
  <!-- Outer Range Ring -->
  <circle cx="16" cy="16" r="13" stroke="#22c55e" stroke-width="0.75" stroke-dasharray="3 3" opacity="0.4" />
  <circle cx="16" cy="16" r="7" stroke="#22c55e" stroke-width="0.5" opacity="0.3" />

  <!-- Sweeping Radar Scanner Line -->
  <g class="radar-sweep">
    <line x1="16" y1="16" x2="28" y2="16" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" filter="url(#radarGlow)" />
    <path d="M16 16 L28 16 A12 12 0 0 0 24.5 7.5 Z" fill="#22c55e" opacity="0.25" />
  </g>

  <!-- Active 3D Data Beacon Nodes -->
  <circle cx="16" cy="16" r="2.2" fill="#ffffff" filter="url(#radarGlow)" />
  <circle cx="21" cy="11" r="1.8" fill="#4ade80" class="beacon-node" filter="url(#radarGlow)" />
  <circle cx="10" cy="19" r="1.6" fill="#38bdf8" class="beacon-node" filter="url(#radarGlow)" />
</svg>
