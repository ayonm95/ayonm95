<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <radialGradient id="radarSweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#22c55e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0" />
    </radialGradient>
    <filter id="radarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#4ade80" flood-opacity="0.8" />
    </filter>

    <style>
      @keyframes sweepRotate {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }

      @keyframes blipPing {
        0%, 100% {
          transform: scale(0.8);
          opacity: 0.3;
        }
        50% {
          transform: scale(1.4);
          opacity: 1;
        }
      }

      @keyframes ringPulse {
        0%, 100% {
          opacity: 0.5;
        }
        50% {
          opacity: 0.9;
        }
      }

      .sweep-arm {
        transform-origin: 16px 16px;
        animation: sweepRotate 2.6s linear infinite;
      }

      .blip {
        transform-origin: center;
        animation: blipPing 1.6s ease-in-out infinite;
      }

      .blip-delay {
        transform-origin: center;
        animation: blipPing 1.6s ease-in-out infinite 0.8s;
      }

      .ring-pulse {
        animation: ringPulse 2.6s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .sweep-arm, .blip, .blip-delay, .ring-pulse {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Radar Scope Outer Ring -->
  <circle cx="16" cy="16" r="14.5" stroke="#22c55e" stroke-width="1.8" fill="#0d1f14" fill-opacity="0.7" class="ring-pulse" />
  
  <!-- Middle Range Ring -->
  <circle cx="16" cy="16" r="9.5" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.65" />
  
  <!-- Inner Ring -->
  <circle cx="16" cy="16" r="4.5" stroke="#34d399" stroke-width="1.2" opacity="0.8" />

  <!-- Crosshair Axes -->
  <line x1="16" y1="2" x2="16" y2="30" stroke="#34d399" stroke-width="1.2" opacity="0.5" />
  <line x1="2" y1="16" x2="30" y2="16" stroke="#34d399" stroke-width="1.2" opacity="0.5" />

  <!-- Rotating Radar Sweep Wedge -->
  <g class="sweep-arm">
    <path d="M16 16 L30 16 A14 14 0 0 0 25.9 6.1 Z" fill="url(#radarSweepGrad)" />
    <line x1="16" y1="16" x2="30" y2="16" stroke="#86efac" stroke-width="2" stroke-linecap="round" filter="url(#radarGlow)" />
  </g>

  <!-- Blip Detection Targets -->
  <g class="blip" transform="translate(22, 10)">
    <circle cx="0" cy="0" r="2.2" fill="#38bdf8" filter="url(#radarGlow)" />
    <circle cx="0" cy="0" r="4" stroke="#38bdf8" stroke-width="0.8" opacity="0.6" />
  </g>
  <g class="blip-delay" transform="translate(10, 22)">
    <circle cx="0" cy="0" r="2" fill="#facc15" filter="url(#radarGlow)" />
  </g>

  <!-- Center Pivot Core -->
  <circle cx="16" cy="16" r="2" fill="#86efac" filter="url(#radarGlow)" />
</svg>
