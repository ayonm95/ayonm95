<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="plateRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="barSteel" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="fitnessGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#f43f5e" flood-opacity="0.7" />
    </filter>

    <style>
      @keyframes doublePulse {
        0%, 100% {
          transform: scale(0.95);
        }
        14% {
          transform: scale(1.12);
        }
        24% {
          transform: scale(1.02);
        }
        34% {
          transform: scale(1.15);
        }
        48% {
          transform: scale(0.95);
        }
      }

      @keyframes waveFlow {
        0% {
          stroke-dashoffset: 48;
          opacity: 0.4;
        }
        50% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        100% {
          stroke-dashoffset: -48;
          opacity: 0.4;
        }
      }

      .pump-body {
        transform-origin: 16px 16px;
        animation: doublePulse 1.8s cubic-bezier(0.2, 1, 0.3, 1) infinite;
      }

      .pulse-ekg {
        stroke-dasharray: 24 10;
        animation: waveFlow 1.8s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .pump-body, .pulse-ekg {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <g class="pump-body" filter="url(#fitnessGlow)">
    <!-- Polished Steel Barbell Shaft -->
    <rect x="7" y="14" width="18" height="4" rx="2" fill="url(#barSteel)" stroke="#475569" stroke-width="0.8" />

    <!-- Left Outer Plate -->
    <rect x="2" y="9" width="3.5" height="14" rx="1.75" fill="#be123c" />
    <!-- Left Main Plate -->
    <rect x="5.5" y="6" width="4.5" height="20" rx="2.25" fill="url(#plateRed)" stroke="#fda4af" stroke-width="0.8" />
    <!-- Left Plate Highlight -->
    <line x1="7.5" y1="8" x2="7.5" y2="24" stroke="#ffffff" stroke-width="1" opacity="0.6" stroke-linecap="round" />

    <!-- Right Outer Plate -->
    <rect x="26.5" y="9" width="3.5" height="14" rx="1.75" fill="#be123c" />
    <!-- Right Main Plate -->
    <rect x="22" y="6" width="4.5" height="20" rx="2.25" fill="url(#plateRed)" stroke="#fda4af" stroke-width="0.8" />
    <!-- Right Plate Highlight -->
    <line x1="24" y1="8" x2="24" y2="24" stroke="#ffffff" stroke-width="1" opacity="0.6" stroke-linecap="round" />

    <!-- Center Collar Rings -->
    <rect x="10" y="13" width="2" height="6" rx="1" fill="#f8fafc" />
    <rect x="20" y="13" width="2" height="6" rx="1" fill="#f8fafc" />

    <!-- Neon Cardiac Heartbeat Wave surging across -->
    <path d="M2 16 L10 16 L12 9 L15 23 L17 11 L19 19 L21 16 L30 16" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="pulse-ekg" />
    <path d="M2 16 L10 16 L12 9 L15 23 L17 11 L19 19 L21 16 L30 16" stroke="#fde047" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class="pulse-ekg" opacity="0.9" />
  </g>
</svg>
