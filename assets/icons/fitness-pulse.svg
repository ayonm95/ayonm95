<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="heartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes heartPump {
        0%, 100% {
          transform: scale(0.96);
        }
        14% {
          transform: scale(1.12);
        }
        24% {
          transform: scale(1.02);
        }
        34% {
          transform: scale(1.16);
        }
        48% {
          transform: scale(0.96);
        }
      }

      @keyframes pulseDash {
        0% {
          stroke-dashoffset: 40;
          opacity: 0.3;
        }
        50% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        100% {
          stroke-dashoffset: -40;
          opacity: 0.3;
        }
      }

      .pump-group {
        transform-origin: 16px 16px;
        animation: heartPump 1.8s cubic-bezier(0.21, 1, 0.36, 1) infinite;
      }

      .ekg-line {
        stroke-dasharray: 20 8;
        animation: pulseDash 1.8s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .pump-group, .ekg-line {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Animated Pump Group -->
  <g class="pump-group">
    <!-- Center Barbell Shaft -->
    <rect x="9" y="14.5" width="14" height="3" rx="1.5" fill="url(#barGrad)" />

    <!-- Left Weight Plates -->
    <rect x="6" y="9" width="3" height="14" rx="1.5" fill="url(#dbGrad)" />
    <rect x="3" y="11" width="2.5" height="10" rx="1.2" fill="#dc2626" />
    <!-- Left Plate Highlight -->
    <line x1="7.2" y1="10" x2="7.2" y2="22" stroke="#ffffff" stroke-width="0.8" opacity="0.6" stroke-linecap="round" />

    <!-- Right Weight Plates -->
    <rect x="23" y="9" width="3" height="14" rx="1.5" fill="url(#dbGrad)" />
    <rect x="26.5" y="11" width="2.5" height="10" rx="1.2" fill="#dc2626" />
    <!-- Right Plate Highlight -->
    <line x1="24.2" y1="10" x2="24.2" y2="22" stroke="#ffffff" stroke-width="0.8" opacity="0.6" stroke-linecap="round" />

    <!-- EKG Heartbeat Cardiac Wave across Barbell -->
    <path d="M4 16 L11 16 L13 11 L15 22 L17 13 L19 18 L21 16 L28 16" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="ekg-line" filter="url(#heartGlow)" />
  </g>
</svg>
