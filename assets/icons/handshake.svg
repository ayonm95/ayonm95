<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 32" width="40" height="32" fill="none">
  <defs>
    <linearGradient id="cuffBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cuffGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="skinL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="skinR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="handGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#facc15" flood-opacity="0.6" />
    </filter>

    <style>
      @keyframes shakeMovement {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        12% {
          transform: translateY(-3.2px) rotate(-4deg);
        }
        24% {
          transform: translateY(3px) rotate(3.5deg);
        }
        36% {
          transform: translateY(-2.2px) rotate(-2.5deg);
        }
        48% {
          transform: translateY(1.8px) rotate(2deg);
        }
        60% {
          transform: translateY(0px) rotate(0deg);
        }
      }

      @keyframes burstParticles {
        0%, 55%, 100% {
          opacity: 0;
          transform: scale(0.6);
        }
        15%, 38% {
          opacity: 1;
          transform: scale(1.2);
        }
      }

      .shaking-hands {
        transform-origin: 20px 18px;
        animation: shakeMovement 2.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      .sparks-burst {
        transform-origin: 20px 6px;
        animation: burstParticles 2.2s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .shaking-hands, .sparks-burst {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Glowing Connection Star Bursts -->
  <g class="sparks-burst">
    <!-- Top Central Star -->
    <path d="M20 1 L21 4 L24 5 L21 6 L20 9 L19 6 L16 5 L19 4 Z" fill="#facc15" />
    <!-- Left Cyan Spark -->
    <circle cx="13" cy="4" r="1.5" fill="#38bdf8" />
    <!-- Right Emerald Spark -->
    <circle cx="27" cy="4" r="1.5" fill="#34d399" />
  </g>

  <!-- Clasping Hands Group -->
  <g class="shaking-hands" filter="url(#handGlow)">
    <!-- Left Sleeve / Cuff (Cyan-Blue) -->
    <path d="M1 14 L9 9 L13 14 L5 20 Z" fill="url(#cuffBlue)" stroke="#0369a1" stroke-width="0.8" />
    <path d="M9 9 L13 14" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.9" />

    <!-- Right Sleeve / Cuff (Emerald-Green) -->
    <path d="M39 14 L31 9 L27 14 L35 20 Z" fill="url(#cuffGreen)" stroke="#047857" stroke-width="0.8" />
    <path d="M31 9 L27 14" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.9" />

    <!-- Left Hand Clasping Forward -->
    <path d="M10 13 L19 20 C20.8 21.2 23.2 20.8 24.4 19.4 L26.2 17.2 C27 16.2 26.8 14.6 25.6 13.6 L20 9.5 L12 11 Z" fill="url(#skinL)" stroke="#b45309" stroke-width="1" stroke-linejoin="round" />

    <!-- Right Hand Clasping Around Left Hand -->
    <path d="M30 13 L21 20 C19.2 21.2 16.8 20.8 15.6 19.4 L13.8 17.2 C13 16.2 13.2 14.6 14.4 13.6 L20 9.5 L28 11 Z" fill="url(#skinR)" stroke="#b45309" stroke-width="1" stroke-linejoin="round" opacity="0.96" />

    <!-- Knuckle Lines / Finger Grooves -->
    <path d="M17 16 C18.5 14.5 21.5 14.5 23 16" stroke="#78350f" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M18 19 C19.5 17.5 22 17.5 23.2 19" stroke="#78350f" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M19 21.8 C20.2 20.8 22 20.8 23 21.8" stroke="#78350f" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.75" />
  </g>
</svg>
