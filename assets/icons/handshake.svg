<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="leftArmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="rightArmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="handLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="handRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes shakeHands {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        12% {
          transform: translateY(-2.5px) rotate(-4deg);
        }
        24% {
          transform: translateY(2.2px) rotate(3.5deg);
        }
        36% {
          transform: translateY(-2px) rotate(-3deg);
        }
        48% {
          transform: translateY(1.5px) rotate(2deg);
        }
        60% {
          transform: translateY(0px) rotate(0deg);
        }
      }

      @keyframes sparkBurst {
        0%, 55%, 100% {
          opacity: 0;
          transform: scale(0.6);
        }
        15%, 35% {
          opacity: 1;
          transform: scale(1.15);
        }
      }

      .handshake-group {
        transform-origin: 16px 17px;
        animation: shakeHands 2.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      .sparkle-accent {
        transform-origin: 16px 8px;
        animation: sparkBurst 2.2s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .handshake-group, .sparkle-accent {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Connection Sparks (Burst on Shake) -->
  <g class="sparkle-accent" filter="url(#softGlow)">
    <line x1="16" y1="4" x2="16" y2="7" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" />
    <line x1="11" y1="6" x2="13" y2="8.5" stroke="#fde047" stroke-width="1.4" stroke-linecap="round" />
    <line x1="21" y1="6" x2="19" y2="8.5" stroke="#34d399" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Handshake Clasp Core -->
  <g class="handshake-group">
    <!-- Left Sleeve / Cuff -->
    <path d="M2 13 L8 9 L11 13 L5 17 Z" fill="url(#leftArmGrad)" rx="1" />
    <line x1="7" y1="10" x2="10" y2="14" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.6" />

    <!-- Right Sleeve / Cuff -->
    <path d="M30 13 L24 9 L21 13 L27 17 Z" fill="url(#rightArmGrad)" rx="1" />
    <line x1="25" y1="10" x2="22" y2="14" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.6" />

    <!-- Left Palm / Forehand reaching down-right -->
    <path d="M8 12 L15 17.5 C16.2 18.4 17.8 18.2 18.8 17.2 L20.5 15.5 C21.2 14.8 21.1 13.6 20.2 13 L15.5 9.5 L10 10.5 Z" fill="url(#handLeftGrad)" />

    <!-- Right Hand Clasp Fingers wrapping around -->
    <path d="M23 12 L17 17.5 C15.8 18.4 14.2 18.2 13.2 17.2 L11.5 15.5 C10.8 14.8 10.9 13.6 11.8 13 L16.5 9.5 L22 10.5 Z" fill="url(#handRightGrad)" opacity="0.9" />

    <!-- Knuckle Clasp Details -->
    <path d="M13.5 14.5 C14.5 13.5 16 13.5 17 14.5" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.55" />
    <path d="M14.5 16.5 C15.3 15.7 16.5 15.7 17.3 16.5" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.55" />
    <path d="M15.5 18.5 C16.2 17.8 17.2 17.8 17.8 18.5" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.55" />

    <!-- Grip Center Accent Point -->
    <circle cx="16" cy="16" r="1.2" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
