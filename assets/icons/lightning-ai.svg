<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="boltCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="electricShock" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#facc15" flood-opacity="0.9" />
    </filter>

    <style>
      @keyframes boltPulse {
        0%, 100% {
          transform: scale(0.96);
          filter: drop-shadow(0 0 2px rgba(250, 204, 21, 0.4));
        }
        20% {
          transform: scale(1.1);
          filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.95));
        }
        25% {
          transform: scale(1.02);
          filter: drop-shadow(0 0 4px rgba(250, 204, 21, 0.6));
        }
        30% {
          transform: scale(1.14);
          filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.9));
        }
        40% {
          transform: scale(0.96);
          filter: drop-shadow(0 0 2px rgba(250, 204, 21, 0.4));
        }
      }

      @keyframes sparkOrb {
        0%, 100% {
          opacity: 0.2;
          transform: scale(0.6);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }

      .bolt-body {
        transform-origin: 16px 16px;
        animation: boltPulse 2s cubic-bezier(0.2, 0.9, 0.3, 1) infinite;
      }

      .spark-1 {
        transform-origin: 6px 12px;
        animation: sparkOrb 1.4s ease-in-out infinite;
      }
      .spark-2 {
        transform-origin: 26px 18px;
        animation: sparkOrb 1.4s ease-in-out infinite 0.7s;
      }

      @media (prefers-reduced-motion: reduce) {
        .bolt-body, .spark-1, .spark-2 {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Surrounding Electric Sparks -->
  <circle cx="6" cy="12" r="1.5" fill="#38bdf8" class="spark-1" />
  <circle cx="26" cy="18" r="1.8" fill="#38bdf8" class="spark-2" />

  <!-- Animated Chunky Lightning Bolt -->
  <g class="bolt-body" filter="url(#electricShock)">
    <!-- Main Bolt Silhouette -->
    <path d="M19 2 L7 16 L15 16 L11 30 L25 14 L17 14 Z" fill="url(#boltCore)" stroke="#ca8a04" stroke-width="0.8" stroke-linejoin="round" />
    
    <!-- Specular Inner Highlight -->
    <path d="M17.5 4.5 L9.5 15 L14 15 L11.8 24 L21.5 14.5 L16.5 14.5 Z" fill="#ffffff" opacity="0.6" />
  </g>
</svg>
