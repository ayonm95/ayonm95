<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="electricGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes lightningShock {
        0%, 100% {
          transform: scale(0.96) rotate(0deg);
          filter: drop-shadow(0 0 2px rgba(250, 204, 21, 0.4));
        }
        25% {
          transform: scale(1.08) rotate(-2deg);
          filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.9));
        }
        30% {
          transform: scale(1.0) rotate(1deg);
          filter: drop-shadow(0 0 4px rgba(250, 204, 21, 0.6));
        }
        35% {
          transform: scale(1.12) rotate(-1deg);
          filter: drop-shadow(0 0 10px rgba(250, 204, 21, 1));
        }
        45% {
          transform: scale(0.98) rotate(0deg);
          filter: drop-shadow(0 0 3px rgba(250, 204, 21, 0.5));
        }
      }

      @keyframes sparkFloat {
        0%, 100% {
          opacity: 0.2;
          transform: translateY(0px) scale(0.7);
        }
        35% {
          opacity: 1;
          transform: translateY(-2px) scale(1.3);
        }
        70% {
          opacity: 0.4;
          transform: translateY(1px) scale(0.8);
        }
      }

      .bolt-element {
        transform-origin: 16px 16px;
        animation: lightningShock 2.2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }

      .spark-1 {
        transform-origin: 23px 8px;
        animation: sparkFloat 1.8s ease-in-out infinite;
      }
      .spark-2 {
        transform-origin: 8px 22px;
        animation: sparkFloat 2.4s ease-in-out infinite 0.4s;
      }

      @media (prefers-reduced-motion: reduce) {
        .bolt-element, .spark-1, .spark-2 {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Ambient Energy Halo -->
  <circle cx="16" cy="16" r="10" fill="#facc15" opacity="0.12" />

  <!-- Animated Lightning Bolt -->
  <g class="bolt-element">
    <!-- Back Glow Silhouette -->
    <path d="M18 3 L8 17 L15 17 L13 29 L24 14 L17 14 Z" fill="#ca8a04" opacity="0.3" transform="translate(1, 1)" />

    <!-- Lightning Core Path -->
    <path d="M18 3 L8 17 L15 17 L13 29 L24 14 L17 14 Z" fill="url(#boltGrad)" stroke="#fef08a" stroke-width="0.8" stroke-linejoin="round" />

    <!-- Inner Core Bright Highlight -->
    <path d="M17.2 5.5 L10.5 15.5 L15.5 15.5 L14 24.5 L21.5 14.5 L16.5 14.5 Z" fill="#ffffff" opacity="0.65" />
  </g>

  <!-- Spark Orbits -->
  <g class="spark-1" filter="url(#electricGlow)">
    <polygon points="23,6 24,8 26,8 24.5,9.5 25,11.5 23,10 21,11.5 21.5,9.5 20,8 22,8" fill="#ffffff" />
  </g>
  <g class="spark-2" filter="url(#electricGlow)">
    <circle cx="8" cy="22" r="1.2" fill="#fde047" />
  </g>
</svg>
