<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="eq1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="eq2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="eq3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="eq4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="eq5" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="musicDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#c084fc" flood-opacity="0.6" />
    </filter>

    <style>
      @keyframes bounceBar1 {
        0%, 100% { height: 9px;  y: 19px; }
        50%      { height: 24px; y: 4px;  }
      }
      @keyframes bounceBar2 {
        0%, 100% { height: 25px; y: 3px;  }
        40%      { height: 8px;  y: 20px; }
        80%      { height: 27px; y: 1px;  }
      }
      @keyframes bounceBar3 {
        0%, 100% { height: 28px; y: 1px;  }
        50%      { height: 12px; y: 16px; }
      }
      @keyframes bounceBar4 {
        0%, 100% { height: 14px; y: 14px; }
        35%      { height: 26px; y: 3px;  }
        70%      { height: 8px;  y: 20px; }
      }
      @keyframes bounceBar5 {
        0%, 100% { height: 10px; y: 18px; }
        60%      { height: 22px; y: 6px;  }
      }

      .bar-b1 { animation: bounceBar1 1.1s ease-in-out infinite; }
      .bar-b2 { animation: bounceBar2 0.95s ease-in-out infinite; }
      .bar-b3 { animation: bounceBar3 1.25s ease-in-out infinite; }
      .bar-b4 { animation: bounceBar4 1.05s ease-in-out infinite; }
      .bar-b5 { animation: bounceBar5 1.15s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .bar-b1, .bar-b2, .bar-b3, .bar-b4, .bar-b5 {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <g filter="url(#musicDrop)">
    <!-- 5 Chunky Neon Frequency Bars -->
    <rect class="bar-b1" x="2.5"  y="19" width="4.5" height="9"  rx="2.25" fill="url(#eq1)" />
    <rect class="bar-b2" x="8.5"  y="3"  width="4.5" height="25" rx="2.25" fill="url(#eq2)" />
    <rect class="bar-b3" x="14.5" y="1"  width="4.5" height="28" rx="2.25" fill="url(#eq3)" />
    <rect class="bar-b4" x="20.5" y="14" width="4.5" height="14" rx="2.25" fill="url(#eq4)" />
    <rect class="bar-b5" x="26.5" y="18" width="4.5" height="10" rx="2.25" fill="url(#eq5)" />
  </g>
</svg>
