<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Deep Cosmic Guardian Gradients -->
    <linearGradient id="owlMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="moonGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="beakGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <radialGradient id="nocturnalIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>

    <radialGradient id="pupilAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <filter id="owlBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#6366f1" flood-opacity="0.8" />
    </filter>

    <filter id="eyeBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.95" />
    </filter>

    <style>
      @keyframes nocturnalFloat {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-2.6px) rotate(1.2deg);
        }
      }

      @keyframes eyeBlinkGlow {
        0%, 90%, 100% {
          transform: scaleY(1);
          opacity: 1;
        }
        94% {
          transform: scaleY(0.12);
          opacity: 0.5;
        }
        97% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      @keyframes auraBreath {
        0%, 100% {
          opacity: 0.35;
          transform: scale(0.9);
        }
        50% {
          opacity: 0.85;
          transform: scale(1.18);
        }
      }

      @keyframes starTwinkle {
        0%, 100% {
          opacity: 0.3;
          transform: scale(0.65);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }

      .owl-unit {
        transform-origin: 16px 16px;
        animation: nocturnalFloat 2.8s ease-in-out infinite;
      }

      .eye-blink {
        transform-origin: 16px 15.5px;
        animation: eyeBlinkGlow 3.6s ease-in-out infinite;
      }

      .halo-breath {
        transform-origin: 16px 16px;
        animation: auraBreath 2.8s ease-in-out infinite;
      }

      .star-blink {
        transform-origin: 27px 5px;
        animation: starTwinkle 2s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .owl-unit, .eye-blink, .halo-breath, .star-blink {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Ambient Nocturnal Halo -->
  <circle cx="16" cy="16" r="14" fill="url(#pupilAura)" class="halo-breath" />

  <!-- Background Nocturnal Crescent Moon -->
  <path d="M26 3.5 C22 3.5 17.5 6.2 16.5 11 C15.6 14.8 17.2 18.5 19.5 20.2 C16 19 13 16 13 11.5 C13 5.8 17.5 1.5 22.8 1.5 C24.2 1.5 25.4 1.9 26 2.5 C25.3 3 24.8 3.2 26 3.5 Z"
        fill="url(#moonGleam)"
        opacity="0.7"
        filter="url(#owlBloom)"/>

  <!-- Nocturnal Cyber Star Spark -->
  <g class="star-blink">
    <circle cx="27" cy="5" r="1.3" fill="#ffffff" />
    <line x1="27" y1="2.5" x2="27" y2="7.5" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" />
    <line x1="24.5" y1="5" x2="29.5" y2="5" stroke="#38bdf8" stroke-width="0.8" stroke-linecap="round" />
  </g>

  <!-- Animated Owl Guardian Unit -->
  <g class="owl-unit" filter="url(#owlBloom)">
    <!-- Base Shadow Behind Mask -->
    <path d="M4.5 6 L9 11 C11 10 13.5 9.5 16 9.5 C18.5 9.5 21 10 23 11 L27.5 6 L26 16 C26.8 20.2 25.2 24.5 22 27.5 C19.2 30 12.8 30 10 27.5 C6.8 24.5 5.2 20.2 6 16 Z"
          fill="#0a0a1a"
          opacity="0.45"
          transform="translate(0, 1.5)" />

    <!-- Owl Face Silhouette & Cyber Ear Tufts -->
    <path d="M4.5 6 L9 11 C11 10 13.5 9.5 16 9.5 C18.5 9.5 21 10 23 11 L27.5 6 L26 16 C26.8 20.2 25.2 24.5 22 27.5 C19.2 30 12.8 30 10 27.5 C6.8 24.5 5.2 20.2 6 16 Z"
          fill="url(#owlMask)"
          stroke="#818cf8"
          stroke-width="1.3"
          stroke-linejoin="round" />

    <!-- Clamshell Brow Armor Arch -->
    <path d="M8.5 11.5 Q16 14.8 23.5 11.5" stroke="#a5b4fc" stroke-width="1.2" fill="none" opacity="0.9" stroke-linecap="round" />
    <line x1="16" y1="9.5" x2="16" y2="13.8" stroke="#38bdf8" stroke-width="1" opacity="0.95" />

    <!-- Nocturnal Glowing Eyes (Blinking & Focused) -->
    <g class="eye-blink" filter="url(#eyeBloom)">
      <!-- Left Eye Frame & Sclera -->
      <circle cx="11" cy="16" r="4.2" fill="#090d16" stroke="#38bdf8" stroke-width="1" />
      <circle cx="11" cy="16" r="3.2" fill="url(#nocturnalIris)" />
      <!-- Pupil & Gleam -->
      <circle cx="11" cy="16" r="1.4" fill="#020617" />
      <circle cx="11.8" cy="15.2" r="0.85" fill="#ffffff" />

      <!-- Right Eye Frame & Sclera -->
      <circle cx="21" cy="16" r="4.2" fill="#090d16" stroke="#38bdf8" stroke-width="1" />
      <circle cx="21" cy="16" r="3.2" fill="url(#nocturnalIris)" />
      <!-- Pupil & Gleam -->
      <circle cx="21" cy="16" r="1.4" fill="#020617" />
      <circle cx="21.8" cy="15.2" r="0.85" fill="#ffffff" />
    </g>

    <!-- Cyber Gold Beak -->
    <polygon points="16,16.8 13.8,21.2 16,23.8 18.2,21.2" fill="url(#beakGold)" stroke="#b45309" stroke-width="0.7" stroke-linejoin="round" />

    <!-- IOKit Clamshell Power Assertion Indicator (Forehead Diamond Node) -->
    <polygon points="16,10 17.5,12 16,14 14.5,12" fill="#22d3ee" filter="url(#eyeBloom)" />

    <!-- Lower Chest Clamshell Wing Trim -->
    <path d="M8 21 C9.5 24.5 12.5 27.5 16 27.8 C19.5 27.5 22.5 24.5 24 21"
          stroke="#38bdf8"
          stroke-width="1"
          stroke-linecap="round"
          fill="none"
          opacity="0.75" />
  </g>
</svg>
