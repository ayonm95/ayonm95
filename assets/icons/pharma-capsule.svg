<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="capGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="capCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="pharmaGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatPill {
        0%, 100% {
          transform: translateY(0px) rotate(-35deg);
        }
        50% {
          transform: translateY(-2.8px) rotate(-28deg);
        }
      }

      @keyframes auraGlow {
        0%, 100% {
          opacity: 0.35;
          transform: scale(0.9);
        }
        50% {
          opacity: 0.75;
          transform: scale(1.15);
        }
      }

      .pill-group {
        transform-origin: 16px 16px;
        animation: floatPill 2.8s ease-in-out infinite;
      }

      .glow-ring {
        transform-origin: 16px 16px;
        animation: auraGlow 2.8s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .pill-group, .glow-ring {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Aura Ring -->
  <circle cx="16" cy="16" r="11" fill="#22c55e" opacity="0.15" class="glow-ring" filter="url(#pharmaGlow)" />

  <!-- Animated Pill Body -->
  <g class="pill-group">
    <!-- Base Shadow -->
    <rect x="10" y="5" width="12" height="22" rx="6" fill="#000000" opacity="0.3" transform="translate(1.5, 1.5)" />

    <!-- Top Cap (Emerald Green) -->
    <path d="M10 16 L10 11 C10 7.7 12.7 5 16 5 C19.3 5 22 7.7 22 11 L22 16 Z" fill="url(#capGreen)" />
    <!-- Specular Highlight Strip -->
    <path d="M12 9 C12 7.5 13 6.5 14.5 6.2 L14.5 15.5 L12 15.5 Z" fill="#ffffff" opacity="0.4" />

    <!-- Center Band Divider -->
    <line x1="9.5" y1="16" x2="22.5" y2="16" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />

    <!-- Bottom Cap (Ice Cyan) -->
    <path d="M10 16 L10 21 C10 24.3 12.7 27 16 27 C19.3 27 22 24.3 22 21 L22 16 Z" fill="url(#capCyan)" />
    <!-- Bottom Specular Highlight Strip -->
    <path d="M12 16.5 L14.5 16.5 L14.5 25.8 C13 25.5 12 24.5 12 23 Z" fill="#ffffff" opacity="0.3" />

    <!-- Provenance Medical Cross Accent -->
    <g transform="translate(16, 11)" filter="url(#pharmaGlow)">
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
      <line x1="0" y1="-3" x2="0" y2="3" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
    </g>
  </g>
</svg>
