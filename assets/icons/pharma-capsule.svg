<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="capTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="capBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="pillGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#22c55e" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes floatCapsule {
        0%, 100% {
          transform: translateY(0px) rotate(-35deg);
        }
        50% {
          transform: translateY(-3px) rotate(-28deg);
        }
      }

      @keyframes auraBreath {
        0%, 100% {
          opacity: 0.3;
          transform: scale(0.9);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.18);
        }
      }

      .capsule-group {
        transform-origin: 16px 16px;
        animation: floatCapsule 2.6s ease-in-out infinite;
      }

      .pulse-glow {
        transform-origin: 16px 16px;
        animation: auraBreath 2.6s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .capsule-group, .pulse-glow {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="16" cy="16" r="13" fill="#22c55e" opacity="0.25" class="pulse-glow" />

  <!-- Animated Floating Capsule -->
  <g class="capsule-group" filter="url(#pillGlow)">
    <!-- Base Drop Shadow -->
    <rect x="8.5" y="3.5" width="15" height="25" rx="7.5" fill="#000000" opacity="0.35" transform="translate(1.5, 2)" />

    <!-- Top Half (Emerald Green) -->
    <path d="M8.5 16 L8.5 11 C8.5 6.8 11.8 3.5 16 3.5 C20.2 3.5 23.5 6.8 23.5 11 L23.5 16 Z" fill="url(#capTop)" />
    <!-- Top Gloss Shine -->
    <path d="M10.5 9 C10.5 7 12 5.5 14 5 L14 15.5 L10.5 15.5 Z" fill="#ffffff" opacity="0.5" />

    <!-- Center Seam Line -->
    <line x1="8" y1="16" x2="24" y2="16" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />

    <!-- Bottom Half (Electric Cyan) -->
    <path d="M8.5 16 L8.5 21 C8.5 25.2 11.8 28.5 16 28.5 C20.2 28.5 23.5 25.2 23.5 21 L23.5 16 Z" fill="url(#capBottom)" />
    <!-- Bottom Gloss Reflection -->
    <path d="M10.5 16.5 L14 16.5 L14 27 C12 26.5 10.5 25 10.5 23 Z" fill="#ffffff" opacity="0.3" />

    <!-- Medical Provenance Cross -->
    <g transform="translate(16, 11)">
      <line x1="-3.5" y1="0" x2="3.5" y2="0" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <line x1="0" y1="-3.5" x2="0" y2="3.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>
</svg>
