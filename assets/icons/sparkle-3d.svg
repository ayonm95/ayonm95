<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="facetTopL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="facetTopR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="facetBotL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="facetBotR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="gemGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#c084fc" flood-opacity="0.8" />
    </filter>

    <style>
      @keyframes floatCrystal3D {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-2.8px) rotate(3deg);
        }
      }

      @keyframes starTwinkle {
        0%, 100% {
          opacity: 0.3;
          transform: scale(0.6);
        }
        50% {
          opacity: 1;
          transform: scale(1.25);
        }
      }

      .crystal-group {
        transform-origin: 16px 16px;
        animation: floatCrystal3D 2.6s ease-in-out infinite;
      }

      .sparkle-star {
        transform-origin: 25px 5px;
        animation: starTwinkle 1.8s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .crystal-group, .sparkle-star {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- 3D Faceted Gem -->
  <g class="crystal-group" filter="url(#gemGlow)">
    <!-- Top-Left Facet -->
    <polygon points="16,3 4,13 16,16" fill="url(#facetTopL)" />
    <!-- Top-Right Facet -->
    <polygon points="16,3 28,13 16,16" fill="url(#facetTopR)" />
    <!-- Bottom-Left Facet -->
    <polygon points="4,13 16,29 16,16" fill="url(#facetBotL)" />
    <!-- Bottom-Right Facet -->
    <polygon points="28,13 16,29 16,16" fill="url(#facetBotR)" />

    <!-- Crisp Facet Edge Lines -->
    <line x1="16" y1="3" x2="16" y2="29" stroke="#ffffff" stroke-width="1.2" opacity="0.85" />
    <line x1="4" y1="13" x2="28" y2="13" stroke="#ffffff" stroke-width="1" opacity="0.75" />
    <line x1="16" y1="3" x2="4" y2="13" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
    <line x1="16" y1="3" x2="28" y2="13" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />

    <!-- Center Apex Glint -->
    <circle cx="16" cy="16" r="2" fill="#ffffff" />
  </g>

  <!-- Twinkle Star on Top-Right Corner -->
  <g class="sparkle-star">
    <path d="M25 1 L26 4 L29 5 L26 6 L25 9 L24 6 L21 5 L24 4 Z" fill="#ffffff" />
    <circle cx="25" cy="5" r="1" fill="#fbcfe8" />
  </g>
</svg>
