<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="capTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="capBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="tasselGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="capGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.8" flood-color="#818cf8" flood-opacity="0.6" />
    </filter>

    <style>
      @keyframes capTilt {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-2.5px) rotate(2deg);
        }
      }

      @keyframes swingTassel {
        0%, 100% {
          transform: rotate(-18deg);
        }
        50% {
          transform: rotate(20deg);
        }
      }

      .cap-body {
        transform-origin: 16px 16px;
        animation: capTilt 2.6s ease-in-out infinite;
      }

      .tassel-sway {
        transform-origin: 16px 8px;
        animation: swingTassel 1.6s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .cap-body, .tassel-sway {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <g class="cap-body" filter="url(#capGlow)">
    <!-- Skull Cap Base Underneath -->
    <path d="M10 13 L10 19 C10 22.5 13 24 16 24 C19 24 22 22.5 22 19 L22 13 Z" fill="url(#capBaseGrad)" stroke="#818cf8" stroke-width="0.8" />

    <!-- White Diploma Scroll Underneath with Red Ribbon -->
    <g transform="translate(16, 27)">
      <rect x="-10" y="-2" width="20" height="4" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
      <rect x="-2" y="-2" width="4" height="4" fill="#ef4444" />
    </g>

    <!-- Diamond Mortarboard Top -->
    <polygon points="16,4 30,10.5 16,16 2,10.5" fill="url(#capTopGrad)" stroke="#c7d2fe" stroke-width="1" stroke-linejoin="round" />

    <!-- Center Button -->
    <ellipse cx="16" cy="10" rx="2.2" ry="1.4" fill="#facc15" />

    <!-- Hanging Swaying Tassel -->
    <g class="tassel-sway">
      <path d="M16 10 C21 11 25 14 26 18" stroke="#facc15" stroke-width="1.8" fill="none" stroke-linecap="round" />
      <rect x="24" y="17" width="3.5" height="7" rx="1.5" fill="url(#tasselGold)" stroke="#ca8a04" stroke-width="0.6" />
      <circle cx="25.75" cy="17" r="1.5" fill="#facc15" />
    </g>
  </g>
</svg>
