<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <style>
      .tb  { fill: #0d1117; }
      .hd  { fill: #161b22; }
      .ht  { fill: #8b949e; font-family: 'Courier New', Courier, monospace; font-size: 12px; }
      .dr  { fill: #ff5f57; }
      .dy  { fill: #febc2e; }
      .dg  { fill: #28c840; }
      .bl  { stroke: #30363d; stroke-width: 1; fill: none; }
      .pa  { fill: #22c55e; font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; }
      .ph  { fill: #22c55e; font-family: 'Courier New', monospace; font-size: 13px; }
      .pb  { fill: #a78bfa; font-family: 'Courier New', monospace; font-size: 13px; }
      .ct  { fill: #e2e8f0; font-family: 'Courier New', monospace; font-size: 13px; }
      .od  { fill: #8b949e; font-family: 'Courier New', monospace; font-size: 12px; }
      .oc  { fill: #22d3ee; font-family: 'Courier New', monospace; font-size: 12px; }
      .og  { fill: #4ade80; font-family: 'Courier New', monospace; font-size: 12px; }
      .op  { fill: #c084fc; font-family: 'Courier New', monospace; font-size: 12px; }
      .oy  { fill: #fbbf24; font-family: 'Courier New', monospace; font-size: 12px; }
      .cur { fill: #22c55e; }
      .p1  { animation: fi .01s ease .4s both; }
      .c1  { animation: tw .6s steps(6,end) .5s both; }
      .o1  { animation: fi .3s ease 1.3s both; }
      .p2  { animation: fi .01s ease 1.9s both; }
      .c2  { animation: tw .9s steps(14,end) 2s both; }
      .o2a { animation: fi .3s ease 3.2s both; }
      .o2b { animation: fi .3s ease 3.5s both; }
      .o2c { animation: fi .3s ease 3.8s both; }
      .p3  { animation: fi .01s ease 4.9s both; }
      .c3  { animation: tw 1.1s steps(12,end) 5s both; }
      .o3a { animation: fi .3s ease 6.3s both; }
      .o3b { animation: fi .3s ease 6.6s both; }
      .o3c { animation: fi .3s ease 6.9s both; }
      .o3d { animation: fi .3s ease 7.2s both; }
      .p4  { animation: fi .01s ease 8.2s both; }
      .c4  { animation: tw .9s steps(18,end) 8.3s both; }
      .o4a { animation: fi .3s ease 9.5s both; }
      .o4b { animation: fi .3s ease 9.8s both; }
      .p5  { animation: fi .01s ease 10.3s both; }
      .cur { animation: bk 1s step-end infinite 10.4s; }
      @keyframes tw {
        from { clip-path: inset(0 100% 0 0); }
        to   { clip-path: inset(0 0%   0 0); }
      }
      @keyframes fi {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes bk {
        0%,100% { opacity: 1; }
        50%     { opacity: 0; }
      }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="800" height="420" rx="12" class="tb"/>

  <!-- Header bar -->
  <rect width="800" height="42" rx="12" class="hd"/>
  <rect y="21" width="800" height="21" class="hd"/>
  <circle cx="24" cy="21" r="6" class="dr"/>
  <circle cx="44" cy="21" r="6" class="dy"/>
  <circle cx="64" cy="21" r="6" class="dg"/>
  <text x="400" y="21" class="ht" text-anchor="middle" dominant-baseline="middle">ayon@bengaluru-mesh — zsh — 800x420</text>
  <line x1="0" y1="42" x2="800" y2="42" class="bl"/>

  <!-- PROMPT 1: whoami -->
  <g class="p1">
    <text x="20" y="72" class="pa">&#x279C;</text>
    <text x="36" y="72" class="ph">ayon@mesh</text>
    <text x="115" y="72" class="pb"> git:(main)</text>
    <text x="212" y="72" class="ct c1">whoami</text>
  </g>
  <text x="20" y="92" class="od o1">Ayon Moitra  ·  Backend · Web3 · AI Systems Engineer</text>

  <!-- PROMPT 2: cat skills.txt -->
  <g class="p2">
    <text x="20" y="118" class="pa">&#x279C;</text>
    <text x="36" y="118" class="ph">ayon@mesh</text>
    <text x="115" y="118" class="pb"> git:(main)</text>
    <text x="212" y="118" class="ct c2">cat skills.txt</text>
  </g>
  <text x="20" y="138" class="oc o2a">&#x251C;&#x2500;&#x2500; Web3 / EVM    Solidity · Hardhat · Ethers.js · EIP-712 · Sepolia · Polygon Amoy</text>
  <text x="20" y="155" class="og o2b">&#x251C;&#x2500;&#x2500; Backend        Java · TypeScript · Node.js · PostgreSQL · MongoDB · Python</text>
  <text x="20" y="172" class="op o2c">&#x2514;&#x2500;&#x2500; AI / ML        Agentic Swarms · Vector Stores · Model Pipelines [IISc Certified]</text>

  <!-- PROMPT 3: ls projects/ -->
  <g class="p3">
    <text x="20" y="200" class="pa">&#x279C;</text>
    <text x="36" y="200" class="ph">ayon@mesh</text>
    <text x="115" y="200" class="pb"> git:(main)</text>
    <text x="212" y="200" class="ct c3">ls projects/</text>
  </g>
  <text x="20" y="220" class="oy o3a">pharmatree/         Pharmaceutical provenance · Ethereum Sepolia · 21 unit tests</text>
  <text x="20" y="237" class="oc o3b">sonder/             Async Merkle royalty ledger · Polygon Amoy · GAAP double-entry</text>
  <text x="20" y="254" class="og o3c">delivermate/        3-tier logistics dispatch · Firebase · Google Maps Platform API</text>
  <text x="20" y="271" class="od o3d">fitme/              Cross-platform health tracker · Flutter · Cloud Firestore</text>

  <!-- PROMPT 4: ./verify --contract -->
  <g class="p4">
    <text x="20" y="299" class="pa">&#x279C;</text>
    <text x="36" y="299" class="ph">ayon@mesh</text>
    <text x="115" y="299" class="pb"> git:(main)</text>
    <text x="212" y="299" class="ct c4">./verify --contract PharmaTree</text>
  </g>
  <text x="20" y="319" class="og o4a" filter="url(#glow)">&#x2714;  21 passing  (0 failed · 100% assertions green)</text>
  <text x="20" y="336" class="od o4b">   Sepolia: 0x2bAEd948286a073E5c026A4fCe47D93Eb198a044  · VERIFIED</text>

  <!-- PROMPT 5: idle + cursor -->
  <g class="p5">
    <text x="20" y="364" class="pa">&#x279C;</text>
    <text x="36" y="364" class="ph">ayon@mesh</text>
    <text x="115" y="364" class="pb"> git:(main)</text>
    <rect x="212" y="352" width="8" height="16" class="cur"/>
  </g>

  <!-- Status bar -->
  <line x1="0" y1="385" x2="800" y2="385" class="bl"/>
  <rect x="0" y="386" width="800" height="34" class="hd" rx="0"/>
  <rect x="0" y="406" width="800" height="14" class="hd" rx="0"/>
  <text x="20" y="398" class="od" font-size="10">NORMAL</text>
  <text x="780" y="398" class="od" font-size="10" text-anchor="end">MCA · Christ Univ · Amity Univ · B.Sc. · VKSU</text>

  <!-- Outer border -->
  <rect width="800" height="420" rx="12" stroke="#30363d" stroke-width="1" fill="none"/>
</svg>
