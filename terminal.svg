  <text x="18" y="208" class="oy o3a">pharmatree/    Pharma provenance &#x00B7; Ethereum Sepolia &#x00B7; 21 passing tests</text>
  <text x="18" y="224" class="oc o3b">sonder/        Async Merkle royalty ledger &#x00B7; Polygon Amoy &#x00B7; GAAP accounting</text>
  <text x="18" y="240" class="og o3c">delivermate/   3-tier logistics dispatch &#x00B7; Firebase &#x00B7; Google Maps API</text>
  <text x="18" y="256" class="od o3d">fitme/         Cross-platform health tracker &#x00B7; Flutter &#x00B7; Cloud Firestore</text>

  <!-- ── PROMPT 4: npx hardhat test ── -->
  <g class="p4">
    <text x="18" y="284" class="pa">&#x279C;</text>
    <text x="33" y="284" class="ph">ayon</text>
    <text x="67" y="284" class="pb"> &#x276E;main&#x276F;</text>
    <text x="140" y="284" class="ct c4">npx hardhat test --network sepolia</text>
  </g>
  <text x="18" y="302" class="og o4a" filter="url(#glow)">&#x2714;  21 passing  (0 failed &#x00B7; 100% assertions green)</text>
  <text x="18" y="318" class="od o4b">   Deployed: 0x2bAEd948286a073E5c026A4fCe47D93Eb198a044 &#x00B7; Etherscan VERIFIED</text>

  <!-- ── PROMPT 5: idle cursor ── -->
  <g class="p5">
    <text x="18" y="346" class="pa">&#x279C;</text>
