  <text x="18" y="130" class="oc o2a">&#x251C;&#x2500;&#x2500; Web3     Solidity &#x00B7; Hardhat &#x00B7; Ethers.js &#x00B7; EIP-712 &#x00B7; Sepolia &#x00B7; Polygon Amoy</text>
  <text x="18" y="146" class="og o2b">&#x251C;&#x2500;&#x2500; Backend  Java &#x00B7; TypeScript &#x00B7; Node.js &#x00B7; Express &#x00B7; PostgreSQL &#x00B7; MongoDB</text>
  <text x="18" y="162" class="op o2c">&#x2514;&#x2500;&#x2500; AI/ML    Agentic Swarms &#x00B7; Vector Stores &#x00B7; LLM Pipelines &#x00B7; [IISc Certified]</text>

  <!-- ── PROMPT 3: ls projects/ ── -->
  <g class="p3">
    <text x="18" y="190" class="pa">&#x279C;</text>
    <text x="33" y="190" class="ph">ayon</text>
    <text x="67" y="190" class="pb"> &#x276E;main&#x276F;</text>
    <text x="140" y="190" class="ct c3">ls -1 projects/</text>
