  <!-- Traffic lights -->
  <circle cx="22" cy="20" r="6" class="dr"/>
  <circle cx="42" cy="20" r="6" class="dy"/>
  <circle cx="62" cy="20" r="6" class="dg"/>

  <!-- Title -->
  <text x="400" y="20" class="ht" text-anchor="middle" dominant-baseline="middle">ayon@bengaluru &#x2014; zsh &#x2014; 800&#xD7;440</text>
  <line x1="0" y1="40" x2="800" y2="40" class="bl"/>

  <!-- ── PROMPT 1: whoami ── -->
  <g class="p1">
    <text x="18" y="68" class="pa">&#x279C;</text>
    <text x="33" y="68" class="ph">ayon</text>
