<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
  <defs>
    <style>
      .tb  { fill: #0d1117; }
      .hd  { fill: #161b22; }
      .ht  { fill: #8b949e; font-family: 'Courier New',Courier,monospace; font-size: 11px; }
      .dr  { fill: #ff5f57; }
      .dy  { fill: #febc2e; }
      .dg  { fill: #28c840; }
      .bl  { stroke: #30363d; stroke-width: 1; fill: none; }
      .pa  { fill: #22c55e; font-family: 'Courier New',monospace; font-size: 13px; font-weight: 700; }
      .ph  { fill: #22c55e; font-family: 'Courier New',monospace; font-size: 13px; }
      .pb  { fill: #a78bfa; font-family: 'Courier New',monospace; font-size: 13px; }
      .ct  { fill: #e2e8f0; font-family: 'Courier New',monospace; font-size: 13px; }
      .od  { fill: #8b949e; font-family: 'Courier New',monospace; font-size: 11.5px; }
      .oc  { fill: #22d3ee; font-family: 'Courier New',monospace; font-size: 11.5px; }
      .og  { fill: #4ade80; font-family: 'Courier New',monospace; font-size: 11.5px; }
      .op  { fill: #c084fc; font-family: 'Courier New',monospace; font-size: 11.5px; }
      .oy  { fill: #fbbf24; font-family: 'Courier New',monospace; font-size: 11.5px; }
      .cur { fill: #22c55e; }
      .sb  { fill: #1c2128; }
      /* === Animations === */
      .p1  { opacity: 0; animation: fi .01s ease .40s forwards; }
      .c1  { animation: tw .55s steps(6,end) .5s both; }
      .o1  { opacity: 0; animation: fi .25s ease 1.25s forwards; }
      .p2  { opacity: 0; animation: fi .01s ease 1.90s forwards; }
      .c2  { animation: tw .80s steps(14,end) 2.0s both; }
      .o2a { opacity: 0; animation: fi .25s ease 3.0s forwards; }
      .o2b { opacity: 0; animation: fi .25s ease 3.3s forwards; }
      .o2c { opacity: 0; animation: fi .25s ease 3.6s forwards; }
      .p3  { opacity: 0; animation: fi .01s ease 4.6s forwards; }
      .c3  { animation: tw 1.0s steps(12,end) 4.7s both; }
      .o3a { opacity: 0; animation: fi .25s ease 5.9s forwards; }
      .o3b { opacity: 0; animation: fi .25s ease 6.2s forwards; }
      .o3c { opacity: 0; animation: fi .25s ease 6.5s forwards; }
      .o3d { opacity: 0; animation: fi .25s ease 6.8s forwards; }
      .p4  { opacity: 0; animation: fi .01s ease 7.8s forwards; }
      .c4  { animation: tw .80s steps(26,end) 7.9s both; }
      .o4a { opacity: 0; animation: fi .25s ease 8.9s forwards; }
      .o4b { opacity: 0; animation: fi .25s ease 9.2s forwards; }
      .p5  { opacity: 0; animation: fi .01s ease 9.9s forwards; }
      .cur { animation: bk 1s step-end infinite 10.1s; }
      @keyframes tw {
        from { clip-path: inset(0 100% 0 0); }
        to   { clip-path: inset(0 0%   0 0); }
      }
      @keyframes fi { to { opacity: 1; } }
      @keyframes bk {
        0%,100% { opacity: 1; }
        50%     { opacity: 0; }
      }
    </style>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Main background -->
  <rect width="800" height="440" rx="12" class="tb"/>

  <!-- Title bar bg -->
  <rect width="800" height="40" rx="12" class="hd"/>
