  <line x1="0" y1="368" x2="800" y2="368" class="bl"/>
  <rect x="0" y="369" width="800" height="71" class="hd"/>
  <rect x="0" y="427" width="800" height="13" rx="0" class="hd"/>
  <rect x="0" y="428" width="800" height="12" rx="0" ry="0" class="hd"/>

  <!-- Status left pill -->
  <rect x="10" y="378" width="62" height="18" rx="3" fill="#22c55e"/>
  <text x="41" y="390" font-family="'Courier New',monospace" font-size="10" fill="#0d1117" font-weight="700" text-anchor="middle">NORMAL</text>

  <!-- Branch pill -->
  <rect x="82" y="378" width="56" height="18" rx="3" fill="#a78bfa"/>
  <text x="110" y="390" font-family="'Courier New',monospace" font-size="10" fill="#0d1117" font-weight="700" text-anchor="middle">&#x276E;main&#x276F;</text>

  <!-- Right info -->
  <text x="790" y="390" class="od" font-size="10" text-anchor="end">MCA · Christ Univ  |  B.Sc. · VKSU  |  moitraayon14@gmail.com</text>

  <!-- Second status row: open to work -->
  <text x="18" y="415" class="og" font-size="10.5">&#x25CF; Open to: Backend · Web3 · AI/ML Engineering roles</text>
  <text x="790" y="415" class="od" font-size="10" text-anchor="end">linkedin.com/in/ayonmoitra</text>

